<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keryx</title>
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" sizes="192x192" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <script>
      try {
        const t = localStorage.getItem('keryx-theme')
        if (['system', 'light', 'dark'].includes(t)) document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript
      >Enable JavaScript to use the Keryx dashboard. Published document links work without
      JavaScript.</noscript
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
