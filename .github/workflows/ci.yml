name: CI

# Tests only. Releases are built and published elsewhere; this workflow
# publishes nothing.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (build + lint + test)
    runs-on: ubuntu-latest
    env:
      # Debuginfo roughly doubles target/ and the restored cache, and nothing
      # here needs symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from rust-toolchain.toml, so CI resolves and builds
      # exactly as a developer machine does, including min-publish-age.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo build
        run: cargo build --all-targets
      - name: cargo test
        run: cargo test

  postgres:
    name: Store suite on Postgres
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      # The store's test factory opens a fresh schema here instead of
      # in-memory SQLite, so the same suite proves both backends. The plain
      # test job above is the SQLite run.
      KERYX_TEST_DATABASE_URL: postgres://postgres:keryx@localhost:5432/keryx
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: keryx
          POSTGRES_DB: keryx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # keryx-db holds the store suite, including concurrent uploads to one
      # draft and concurrent migrators; keryx-server drives the same store
      # through every handler.
      - name: cargo test (Postgres)
        run: cargo test -p keryx-db -p keryx-server

  supply-chain:
    name: Supply chain (deny + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Pinned, and built from crates.io, on purpose. The newest prebuilt
      # cargo-vet release is 0.10.0, which cannot parse the trusted-publisher
      # entries that 0.10.2 writes to imports.lock for crates published through
      # crates.io Trusted Publishing. CI must run the version that writes the
      # files. rust-cache keeps ~/.cargo/bin, so this compiles once.
      - name: Install cargo-vet
        run: |
          if ! cargo vet --version 2>/dev/null | grep -qx "cargo-vet 0.10.2"; then
            cargo install cargo-vet --version 0.10.2 --locked
          fi
      - name: cargo deny
        run: cargo deny check
      - name: cargo vet
        run: cargo vet --locked
      # ring is the only crypto backend. aws-lc-rs is a C build and a second
      # TLS provider, and several dependencies switch it on by default.
      - name: aws-lc-rs must never enter the build
        run: |
          for crate in aws-lc-rs aws-lc-sys; do
            if cargo tree --workspace --all-features --target all -i "$crate" 2>/dev/null; then
              echo "::error::$crate entered the dependency graph"
              exit 1
            fi
          done
