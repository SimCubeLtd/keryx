name: release
run-name: queue release build for ${{ github.event.release.tag_name }}

# GitHub isolates caches by branch or tag. Release events run in the tag's
# scope, so building here would create a cache that no later release can read.
# Dispatch the actual build from the default branch instead; that workflow
# still checks out and verifies this exact immutable tag.
on:
  release:
    types: [published]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: queue the cached build
    runs-on: ubuntu-latest
    steps:
      - name: Build and attach this release from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          gh workflow run release-build.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$DEFAULT_BRANCH"
          --field "tag=$TAG"
