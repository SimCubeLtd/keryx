[package]
name = "keryx-store"
description = "Keryx blob storage: draft HTML bytes addressed by opaque object keys."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Exposes test_store() to the test suites of dependent crates.
test-support = ["opendal-core/services-memory"]
# S3-compatible object storage through OpenDAL.
s3 = [
    "dep:opendal-http-transport-reqwest",
    "dep:opendal-service-s3",
    "dep:reqsign-aws-v4",
    "dep:reqsign-core",
    "dep:reqwest",
    "dep:rustls",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
keryx-core.workspace = true
opendal-core.workspace = true
opendal-http-transport-reqwest = { workspace = true, optional = true }
opendal-service-fs.workspace = true
opendal-service-s3 = { workspace = true, optional = true }
reqsign-aws-v4 = { workspace = true, optional = true }
reqsign-core = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
opendal-core = { workspace = true, features = ["services-memory"] }
tempfile.workspace = true
