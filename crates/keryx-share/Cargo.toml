[package]
name = "keryx-share"
description = "Share a Keryx draft version as an OCI artifact. The only crate that depends on oci-client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
docker_credential.workspace = true
oci-client.workspace = true
# oci-client calls reqwest's TLS builder methods unconditionally but is built
# with neither of its own TLS features (both hard-wire aws-lc-rs or OpenSSL).
# Declaring reqwest with rustls-no-provider here makes that compile on ring
# without relying on some other crate to switch the feature on.
reqwest.workspace = true
tokio.workspace = true

[dev-dependencies]
rustls.workspace = true
