[workspace]
members = ["."]
# Plain `cargo test` / `cargo clippy` must cover every crate, not only the
# root binary, so CI and local habits keep working unchanged.
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/SimCubeLtd/keryx"

# Every dependency is declared once here, so no crate can drift onto another
# version or feature set by accident. Crates opt in with `workspace = true`.
[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
fulgur = "0.40"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hex = "0.4"
open = "5"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
url = "2"
usvg = { version = "0.45", default-features = false, features = ["text"] }
web-push-native = "0.5"
woff2-patched = "0.4"

[package]
name = "keryx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keryx (κῆρυξ): a self-hosted herald for agents — publish static HTML drafts via server, CLI, and TUI."
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
fulgur.workspace = true
futures-util.workspace = true
hex.workspace = true
open.workspace = true
rand.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
usvg.workspace = true
web-push-native.workspace = true
woff2-patched.workspace = true

[profile.release]
lto = true
strip = true
